<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Before any CSS: picks light or dark so the first paint is right. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (
            t === "dark" ||
            (!t && matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚡</text></svg>"
    />
    <!-- Linked here (not imported from JS) so the CSS arrives before the first paint in dev too. -->
    <link rel="stylesheet" href="/src/styles.css" />
    <!--app-head-->
  </head>
  <body
    class="bg-zinc-50 text-zinc-800 antialiased dark:bg-zinc-950 dark:text-zinc-200"
  >
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
